# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds, checks, and signs PingMe on every push and pull request (BUILD_PLAN.md P0.4).
# The signed APK is uploaded as an artifact named pingme-<short-sha>.apk. A tag v*
# also publishes a GitHub release with the APK attached, which is what the owner
# installs.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the next step can see which files this change touches.
          fetch-depth: 0

      # Changes to notes only (docs/ and Markdown files) skip the build and tests and
      # pass in about a minute (owner, 2026-10-01). Tags, new branches, and anything
      # that touches another file always get the full check.
      - name: Notes only?
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ "${{ github.ref_type }}" = "branch" ] && [ -n "$BEFORE" ] \
              && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            files=""
          fi
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            code=false
            echo "Only notes changed, so the build and tests are skipped:"
            printf '%s\n' "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK with licences accepted. Install exactly
      # the packages the build uses so AGP never has to fetch them mid-build.
      - name: Android SDK packages
        if: steps.changes.outputs.code == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code == 'true'
        with:
          cache-provider: basic

      # Go bridge (P3.1). Rebuilt only when anything under gobridge/ changes; the AAR
      # is cached under that hash otherwise. Skipped until gobridge/build.sh exists.
      - name: Go bridge cache
        id: gobridge-cache
        if: steps.changes.outputs.code == 'true' && hashFiles('gobridge/build.sh') != ''
        uses: actions/cache@v6
        with:
          path: gobridge/build
          key: gobridge-${{ hashFiles('gobridge/**') }}

      - uses: actions/setup-go@v7
        if: steps.changes.outputs.code == 'true' && hashFiles('gobridge/build.sh') != '' && steps.gobridge-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: gobridge/go.mod
          cache-dependency-path: gobridge/go.sum

      - name: Build Go bridge
        if: steps.changes.outputs.code == 'true' && hashFiles('gobridge/build.sh') != '' && steps.gobridge-cache.outputs.cache-hit != 'true'
        env:
          # build.sh downloads Signal's native library from this repository's releases.
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd gobridge && ./build.sh

      # Release builds are signed with the owner's sideload key so updates install
      # over the previous version. A missing or broken key fails the build on pushes
      # and tags; pull requests from forks get no secrets and fall back to the debug key.
      - name: Sideload keystore
        if: steps.changes.outputs.code == 'true'
        env:
          SIDELOAD_KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SIDELOAD_KEYSTORE_B64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::No signing secrets for this pull request; release APK uses the debug key."
              exit 0
            fi
            echo "::error::Secret SIDELOAD_KEYSTORE_B64 is missing or empty."
            exit 1
          fi
          keystore="$RUNNER_TEMP/pingme-sideload.jks"
          if ! printf '%s' "$SIDELOAD_KEYSTORE_B64" | base64 --decode --ignore-garbage > "$keystore"; then
            echo "::error::SIDELOAD_KEYSTORE_B64 is not valid base64. Re-paste it from the password manager."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$SIDELOAD_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore from SIDELOAD_KEYSTORE_B64 does not open with SIDELOAD_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "SIDELOAD_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Static checks, unit tests, release and demo builds
        if: steps.changes.outputs.code == 'true'
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          # GIF search (UI_DESIGN.md 5.5); without it the GIF picker shows favourites only.
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        # check = ktlintCheck, detekt, Android lint, unit tests (BUILD_PLAN.md P0.5).
        run: ./gradlew check assembleRelease assembleDebug

      - name: Name the APK
        if: steps.changes.outputs.code == 'true'
        id: apk
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="pingme-${{ github.ref_name }}.apk"
          else
            name="pingme-${GITHUB_SHA::7}.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # The demo build: the demo network, beside the real app (BUILD_PLAN.md P2.8).
          demo="${name%.apk}-demo.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$demo"
          echo "demo=$demo" >> "$GITHUB_OUTPUT"

      # Uploaded as the bare .apk (not zipped) so it installs straight from a phone.
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          path: ${{ steps.apk.outputs.name }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.code == 'true'
        with:
          path: ${{ steps.apk.outputs.demo }}
          archive: false
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pingme-sideload.jks"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fetched by pattern, not by the build job's output: that output arrived empty on the
      # first tagged build (v0.1.0) and the release went out without its file.
      - uses: actions/download-artifact@v8
        with:
          pattern: pingme-*.apk
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls pingme-*.apk | grep -v -- '-demo.apk' | head -1)
          test -n "$apk"
          gh release create "${{ github.ref_name }}" "$apk" \
            --repo "${{ github.repository }}" \
            --title "PingMe ${{ github.ref_name }}" \
            --generate-notes
