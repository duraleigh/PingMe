# SPDX-License-Identifier: AGPL-3.0-or-later
# detekt runs its default rule set (buildUponDefaultConfig) plus the Compose rules
# (io.nlopez.compose.rules). This file holds only the differences from the defaults.
# The Compose block is copied from compose-rules 0.6.7 docs/detekt.md, with the
# Material2 check switched on.

complexity:
  TooManyFunctions:
    # DAOs mirror the tables, one query per function, and each repository is the single
    # front door to its part of the store (BUILD_PLAN.md P1.2).
    allowedFunctionsPerClass: 20
    ignoreAnnotated: ['Dao']
    # A connector must implement every call of the Connector interface (DESIGN.md 6.2);
    # those are not a sign of a class doing too much.
    ignoreOverridden: true

style:
  MagicNumber:
    # UI code is made of sizes and colours: dp, sp, and ARGB literals in composables, enum
    # values, and named declarations read better as they are. Elsewhere, numbers need names.
    ignoreAnnotated: ['Composable', 'Preview']
    ignoreEnums: true
    ignorePropertyDeclaration: true
  ReturnCount:
    # Early "nothing to do" exits at the top of a function read better than nesting.
    excludeGuardClauses: true

naming:
  FunctionNaming:
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
    # -- You can optionally disable the checks in this rule for regex matches against the composable name (e.g. molecule presenters)
    # allowedComposableFunctionNames: .*Presenter,.*MoleculePresenter
  ComposableNestingDepth:
    active: false # Opt-in, disabled by default. Turn on if you want to enforce a maximum nesting depth in your composables.
    # -- Maximum nesting depth allowed for content emitters inside a single @Composable function. Defaults to 3.
    # composableNestingDepthThreshold: 3
  ComposableParamOrder:
    active: true
    # -- You can optionally have a list of types to be treated as lambdas (e.g. typedefs or fun interfaces not picked up automatically)
    # treatAsLambda: MyLambdaType
    # -- You can optionally have a list of types to be treated as composable lambdas (e.g. typedefs or fun interfaces not picked up automatically).
    # -- The difference with treatAsLambda is that those need `@Composable` MyLambdaType in the definition, while these won't.
    # treatAsComposableLambda: MyComposableLambdaType
  CompositionLocalAllowlist:
    active: true
    # The theme's own values (core/ui PingMeTheme), which is what CompositionLocals are for.
    allowedCompositionLocals: LocalAppearance,LocalPingMeShapes,LocalNetworkPalette,LocalMessageTextStyle,LocalMotionIntensity
    # -- You can optionally define a list of CompositionLocals that are allowed here
    # allowedCompositionLocals: LocalSomething,LocalSomethingElse
  CompositionLocalNaming:
    active: true
  ConditionHoist:
    active: true
    # -- You can optionally add your own composables here that count as layouts/content emitters
    # contentEmitters: MyLayout,MyOtherLayout
    # -- You can optionally configure argument names that make a layout call too specific to hoist.
    # ignoreCallsWithArgumentNames: modifier,contentAlignment,horizontalArrangement,verticalAlignment
  ContentEmitterReturningValues:
    active: true
    # -- You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  ContentTrailingLambda:
    active: true
    # -- You can optionally have a list of types to be treated as lambdas (e.g. typedefs or fun interfaces not picked up automatically)
    # treatAsLambda: MyLambdaType
    # -- You can optionally have a list of types to be treated as composable lambdas (e.g. typedefs or fun interfaces not picked up automatically).
    # -- The difference with treatAsLambda is that those need `@Composable` MyLambdaType in the definition, while these won't.
    # treatAsComposableLambda: MyComposableLambdaType
  ContentSlotReused:
    active: true
    # -- You can optionally have a list of types to be treated as composable lambdas (e.g. typedefs or fun interfaces not picked up automatically).
    # -- The difference with treatAsLambda is that those need `@Composable` MyLambdaType in the definition, while these won't.
    # treatAsComposableLambda: MyComposableLambdaType
  DefaultsVisibility:
    active: true
  InvalidReadOnlyComposable:
    active: true
  LambdaParameterEventTrailing:
    active: true
    # -- You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
    # -- You can add composables here that you don't want to count as content emitters (e.g. custom dialogs or modals)
    # contentEmittersDenylist: MyNonEmitterComposable
  LambdaParameterInRestartableEffect:
    active: true
    # -- You can optionally have a list of types to be treated as lambdas (e.g. typedefs or fun interfaces not picked up automatically)
    # treatAsLambda: MyLambdaType
  Material2:
    # Turned on: CLAUDE.md rule 10, Material 3 Expressive only.
    active: true
    # -- You can optionally allow parts of it, if you are in the middle of a migration.
    # allowedFromM2: icons.Icons,TopAppBar
  MissingNonRestartableComposable:
    active: true
    # -- Ignore direct and custom @Preview composables (default: true)
    # ignoresPreviews: true
  MissingReadOnlyComposable:
    active: true
  ModifierClickableOrder:
    active: true
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
  ModifierComposed:
    active: true
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
  ModifierMissing:
    active: true
    # -- You can optionally control the visibility of which composables to check for here
    # -- Possible values are: `only_public`, `public_and_internal` and `all` (default is `only_public`)
    # checkModifiersForVisibility: only_public
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
    # -- You can suppress this check in functions annotated with these annotations
    # ignoreAnnotated: ['Potato', 'Banana']
  ModifierNaming:
    active: true
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
  ModifierNotUsedAtRoot:
    active: true
    # -- You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
  ModifierReused:
    active: true
    # -- You can optionally add your own Modifier types
    # customModifiers: BananaModifier,PotatoModifier
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
    # -- You can optionally add your own composables here that will count as content emitters
    # contentEmitters: MyComposable,MyOtherComposable
    # -- You can add composables here that you don't want to count as content emitters (e.g. custom dialogs or modals)
    # contentEmittersDenylist: MyNonEmitterComposable
  MutableParams:
    active: true
  MutableStateAutoboxing:
    active: true
  MutableStateParam:
    active: true
  ParameterNaming:
    active: true
    # -- You can optionally have a list of types to be treated as lambdas (e.g. typedefs or fun interfaces not picked up automatically)
    # treatAsLambda: MyLambdaType
    # -- You can optionally add your allowed lambda names (e.g., usages from the past found in the official Compose code)
    # allowedLambdaParameterNames: onSizeChanged, onGloballyPositioned
  PreviewAnnotationNaming:
    active: true
  PreviewNaming:
    active: false # Opt-in, disabled by default.
    # -- You can optionally configure the naming strategy for previews.
    # -- Possible values are: `suffix`, `prefix`, `anywhere`. By default, it will be `suffix`.
    # previewNamingStrategy: suffix
  PreviewPublic:
    active: true
  RememberContentMissing:
    active: true
  RememberMissing:
    active: true
  StaleRememberUpdatedStateInRemember:
    active: true
  StateParam:
    active: true
  UnnecessaryComposable:
    active: true
  UnnecessaryLaunchedEffect:
    active: true
    # -- Calls whose dispatch or extension receiver has one of these fully qualified types keep LaunchedEffect.
    # allowedCallReceiverTypes:
    #   - androidx.compose.ui.focus.FocusRequester
    # -- Calls whose fully qualified name is listed here keep LaunchedEffect.
    # allowedCallNames:
    #   - androidx.compose.ui.focus.FocusRequester.requestFocus
  UnstableCollections:
    active: false # Opt-in, disabled by default. Turn on if you want to enforce this (e.g. you have strong skipping disabled)
  VarsWithoutStateBacking:
    active: true
  ViewModelForwarding:
    active: true
    # -- You can optionally use this rule on things other than types ending in "ViewModel" or "Presenter" (which are the defaults). You can add your own via a regex here:
    # allowedStateHolderNames: .*ViewModel,.*Presenter
    # -- You can optionally add an allowlist for Composable names that won't be affected by this rule
    # allowedForwarding: .*Content,.*FancyStuff
    # -- You can optionally add an allowlist for ViewModel/StateHolder names that won't be affected by this rule
    # allowedForwardingOfTypes: PotatoViewModel,(Apple|Banana)ViewModel,.*FancyViewModel
  ViewModelInjection:
    active: true
    # -- You can optionally add your own ViewModel factories here
    # viewModelFactories: hiltViewModel,potatoViewModel
